<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BookVault · Rent & Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0c10 !important;
      color: #eef0f5 !important;
      font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .rb-page {
      min-height: calc(100vh - 64px);
      background: #0b0c10;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
    }

    .rb-page::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(45,212,191,.07) 0%, transparent 55%),
        radial-gradient(ellipse 50% 55% at 90% 80%, rgba(201,168,76,.06) 0%, transparent 55%);
    }

    .rb-page::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
    }

    .rb-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      animation: rbIn .6s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes rbIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rb-book-banner {
      background: linear-gradient(135deg, rgba(45,212,191,.08), rgba(201,168,76,.06));
      border: 1px solid rgba(45,212,191,.15);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .85rem;
      margin-bottom: 1.25rem;
    }

    .rb-book-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #0f766e, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(45,212,191,.25);
    }

    .rb-book-icon svg {
      width: 18px;
      height: 18px;
    }

    .rb-book-label {
      font-size: .65rem;
      font-weight: 600;
      color: rgba(45,212,191,.7);
      text-transform: uppercase;
      letter-spacing: .09em;
      margin-bottom: .2rem;
    }

    .rb-book-name {
      font-size: .92rem;
      font-weight: 700;
      color: #eef0f5;
      line-height: 1.25;
    }

    .rb-card {
      background: linear-gradient(160deg, rgba(255,255,255,.038) 0%, rgba(255,255,255,.015) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 22px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .rb-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,212,191,.5), rgba(201,168,76,.3), transparent);
    }

    .rb-card-head {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .rb-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #0f766e, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(45,212,191,.28);
    }

    .rb-card-icon svg {
      width: 17px;
      height: 17px;
    }

    .rb-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #eef0f5;
    }

    .rb-card-sub {
      font-size: .72rem;
      color: rgba(238,240,245,.38);
      margin-top: 1px;
    }

    .rb-price-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem;
      background: rgba(45,212,191,.05);
      border: 1px solid rgba(45,212,191,.12);
      border-radius: 12px;
      margin-bottom: 1.25rem;
    }

    .rb-price-lbl {
      font-size: .75rem;
      color: rgba(238,240,245,.45);
    }

    .rb-price-amt {
      font-size: 1.4rem;
      font-weight: 800;
      color: #2dd4bf;
      letter-spacing: -.02em;
    }

    .rb-field {
      margin-bottom: 1.1rem;
    }

    .rb-field label {
      display: block;
      margin-bottom: .42rem;
      font-size: .7rem;
      font-weight: 600;
      color: rgba(238,240,245,.62);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .rb-input-wrap {
      position: relative;
    }

    .rb-input-icon {
      position: absolute;
      left: .88rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(238,240,245,.28);
      pointer-events: none;
      display: flex;
      transition: color .2s;
    }

    .rb-input-wrap:focus-within .rb-input-icon {
      color: #2dd4bf;
    }

    .rb-input {
      width: 100%;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 11px;
      color: #eef0f5;
      padding: .7rem .9rem .7rem 2.5rem;
      font-size: .88rem;
      font-family: 'DM Sans', system-ui, sans-serif;
      outline: none;
      transition: border .22s, box-shadow .22s, background .22s;
      caret-color: #2dd4bf;
      box-sizing: border-box;
    }

    .rb-input::placeholder {
      color: rgba(238,240,245,.18);
    }

    .rb-input:hover {
      border-color: rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }

    .rb-input:focus {
      border-color: rgba(45,212,191,.45);
      background: rgba(45,212,191,.03);
      box-shadow: 0 0 0 3px rgba(45,212,191,.1);
    }

    input[type=date]::-webkit-calendar-picker-indicator {
      filter: invert(0.6) sepia(1) saturate(2) hue-rotate(140deg);
      cursor: pointer;
      opacity: .6;
    }

    input[type=date]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    .rb-days-hint {
      font-size: .68rem;
      color: rgba(45,212,191,.6);
      margin-top: .3rem;
      display: flex;
      align-items: center;
      gap: .3rem;
    }

    .rb-days-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2dd4bf;
    }

    .rb-pay-btn {
      width: 100%;
      padding: .85rem;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #0f766e, #2dd4bf);
      color: #0b0c10;
      font-size: .92rem;
      font-weight: 700;
      font-family: 'DM Sans', system-ui, sans-serif;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 3px 16px rgba(45,212,191,.28);
      transition: transform .2s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: .25rem;
    }

    .rb-pay-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.18), transparent);
      opacity: 0;
      transition: opacity .2s;
    }

    .rb-pay-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(45,212,191,.4);
    }

    .rb-pay-btn:hover::before {
      opacity: 1;
    }

    .rb-pay-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .rb-pay-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .rb-error {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.22);
      font-size: .8rem;
      color: #f87171;
    }

    .rb-error svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .rb-cancel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      margin-top: .85rem;
      font-size: .78rem;
      color: rgba(238,240,245,.35);
      text-decoration: none;
      transition: color .18s;
    }

    .rb-cancel:hover {
      color: rgba(238,240,245,.6);
    }

    .rb-rzp-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-top: .75rem;
      font-size: .68rem;
      color: rgba(238,240,245,.28);
    }

    .rb-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 1.25rem;
    }

    .rb-trust-item {
      display: flex;
      align-items: center;
      gap: .3rem;
      font-size: .68rem;
      color: rgba(238,240,245,.28);
    }

    .rb-trust-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(45,212,191,.4);
      box-shadow: 0 0 5px rgba(45,212,191,.4);
    }

    .rb-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(11,12,16,.22);
      transform: scale(0);
      animation: rbRip .5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rbRip {
      to { transform: scale(4); opacity: 0; }
    }

    @keyframes rbSpin {
      to { transform: rotate(360deg); }
    }

    @media (max-width:520px) {
      .rb-page {
        padding: 2rem 1rem;
        align-items: flex-start;
        padding-top: 2rem;
      }
      .rb-card {
        padding: 1.5rem 1.1rem;
      }
    }
  </style>
</head>
<body>
<div class="rb-page">
  <div class="rb-wrap">

    <!-- Book banner -->
    <div class="rb-book-banner">
      <div class="rb-book-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(11,12,16,.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <div class="rb-book-label">Renting Book</div>
        <div class="rb-book-name">{{ book.book_title }}</div>
      </div>
    </div>

    <!-- Card -->
    <div class="rb-card">

      <div class="rb-card-head">
        <div class="rb-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(11,12,16,.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        <div>
          <div class="rb-card-title">Complete Payment</div>
          <div class="rb-card-sub">Secure checkout via Razorpay</div>
        </div>
      </div>

      <!-- Error message -->
      {% if error %}
      <div class="rb-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <!-- Price -->
      <div class="rb-price-display">
        <div>
          <div class="rb-price-lbl">Rental Amount</div>
          <div class="rb-price-amt">₹{{ book.book_price }}</div>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(45,212,191,.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
      </div>

      <!-- ─── Razorpay Form ─── -->
      <form id="paymentForm" method="POST" novalidate>
        {% csrf_token %}
        <!-- Hidden fields for Razorpay response -->
        <input type="hidden" name="razorpay_payment_id" id="rzp_payment_id">
        <input type="hidden" name="razorpay_order_id"   id="rzp_order_id">
        <input type="hidden" name="razorpay_signature"  id="rzp_signature">
        <input type="hidden" name="return_date"         id="return_date_hidden">
        <input type="hidden" name="amount"              value="{{ book.book_price }}">

        <!-- Return date picker -->
        <div class="rb-field">
          <label for="return_date_picker">Return Date</label>
          <div class="rb-input-wrap">
            <span class="rb-input-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8"  y1="2" x2="8"  y2="6"/>
                <line x1="3"  y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <input class="rb-input" type="date" id="return_date_picker" onchange="rbDays(this.value)" required/>
          </div>
          <div class="rb-days-hint" id="rbDaysHint"></div>
        </div>

        <!-- Pay button -->
        <button type="button" class="rb-pay-btn" id="rzpBtn" onclick="openRazorpay()">
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(11,12,16,.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          Pay ₹{{ book.book_price }} & Rent
        </button>

      </form>
      <!-- ─────────────── -->

      <!-- Razorpay trust badge -->
      <div class="rb-rzp-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secured by Razorpay
      </div>

      <a href="javascript:history.back()" class="rb-cancel">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go back
      </a>

    </div><!-- /.rb-card -->

    <!-- Trust badges -->
    <div class="rb-trust">
      <div class="rb-trust-item"><div class="rb-trust-dot" aria-hidden="true"></div>256-bit SSL</div>
      <div class="rb-trust-item"><div class="rb-trust-dot" aria-hidden="true"></div>Instant confirmation</div>
      <div class="rb-trust-item"><div class="rb-trust-dot" aria-hidden="true"></div>Easy returns</div>
    </div>

  </div><!-- /.rb-wrap -->
</div>

<!-- Razorpay SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  /* ── Min date = today ── */
  (function() {
    var d = new Date();
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    var today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var datePicker = document.getElementById('return_date_picker');
    if (datePicker) datePicker.setAttribute('min', today);
  })();

  /* ── Days remaining hint ── */
  function rbDays(val) {
    var hint = document.getElementById('rbDaysHint');
    if (!val) {
      hint.innerHTML = '';
      return;
    }
    var diff = Math.ceil((new Date(val) - new Date()) / (1000 * 60 * 60 * 24));
    hint.innerHTML = '<div class="rb-days-dot"></div>' +
      (diff > 0 ? diff + ' day' + (diff !== 1 ? 's' : '') + ' from today' : 'Return today');
  }

  /* ── FULL VOLUME success chime (C5 → E5 → G5) with 80% volume ── */
  function playSuccessChime() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Resume audio context if suspended (fix for autoplay policies)
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      
      // Note 1 — C5 (523 Hz) - FULL VOLUME 0.8
      var o1 = ctx.createOscillator();
      var g1 = ctx.createGain();
      o1.connect(g1);
      g1.connect(ctx.destination);
      o1.frequency.value = 523;
      o1.type = 'sine';
      g1.gain.setValueAtTime(0.8, ctx.currentTime);
      g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      o1.start(ctx.currentTime);
      o1.stop(ctx.currentTime + 0.35);

      // Note 2 — E5 (659 Hz) - FULL VOLUME 0.8
      var o2 = ctx.createOscillator();
      var g2 = ctx.createGain();
      o2.connect(g2);
      g2.connect(ctx.destination);
      o2.frequency.value = 659;
      o2.type = 'sine';
      g2.gain.setValueAtTime(0.8, ctx.currentTime + 0.18);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.53);
      o2.start(ctx.currentTime + 0.18);
      o2.stop(ctx.currentTime + 0.53);

      // Note 3 — G5 (784 Hz) - FULL VOLUME 0.9 (slightly higher for emphasis)
      var o3 = ctx.createOscillator();
      var g3 = ctx.createGain();
      o3.connect(g3);
      g3.connect(ctx.destination);
      o3.frequency.value = 784;
      o3.type = 'sine';
      g3.gain.setValueAtTime(0.9, ctx.currentTime + 0.36);
      g3.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
      o3.start(ctx.currentTime + 0.36);
      o3.stop(ctx.currentTime + 0.9);
      
      console.log("🔊 Full volume success chime played!");
    } catch (e) {
      console.warn('AudioContext not supported', e);
    }
  }

  /* ── Open Razorpay with FULL VOLUME SUCCESS SOUND ── */
  function openRazorpay() {
    var dateVal = document.getElementById('return_date_picker').value;
    if (!dateVal) {
      alert('Please select a return date first.');
      return;
    }
    document.getElementById('return_date_hidden').value = dateVal;

    var btn = document.getElementById('rzpBtn');
    btn.disabled = true;
    btn.innerHTML =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"' +
      ' stroke="rgba(11,12,16,.85)" stroke-width="2.5" stroke-linecap="round"' +
      ' style="animation:rbSpin .75s linear infinite">' +
      '<path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg> Opening payment…';

    var options = {
      key: '{{ razorpay_key }}',
      amount: '{{ amount_paise }}',
      currency: 'INR',
      name: 'BookVault',
      description: 'Rent: {{ book.book_title }}',
      order_id: '{{ order.id }}',
      image: '',
      handler: function(response) {
        // 🔊 FULL VOLUME SUCCESS SOUND 🔊
        playSuccessChime();

        // Fill hidden fields with Razorpay response
        document.getElementById('rzp_payment_id').value = response.razorpay_payment_id;
        document.getElementById('rzp_order_id').value = response.razorpay_order_id;
        document.getElementById('rzp_signature').value = response.razorpay_signature;

        // Update button text to show confirmation
        btn.innerHTML =
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"' +
          ' stroke="rgba(11,12,16,.85)" stroke-width="2.5" stroke-linecap="round"' +
          ' style="animation:rbSpin .75s linear infinite">' +
          '<path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg> Confirming rental…';

        // Slight delay to let the success chime ring and ensure smooth submission
        setTimeout(function() {
          document.getElementById('paymentForm').submit();
        }, 900);
      },
      modal: {
        ondismiss: function() {
          btn.disabled = false;
          btn.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(11,12,16,.85)"' +
            ' stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"' +
            ' width="16" height="16" aria-hidden="true">' +
            '<rect x="2" y="5" width="20" height="14" rx="2"/>' +
            '<line x1="2" y1="10" x2="22" y2="10"/></svg>' +
            ' Pay ₹{{ book.book_price }} & Rent';
        }
      },
      prefill: {
        email: '{{ request.user.email }}',
        name: '{{ request.user.get_full_name }}',
        contact: ''
      },
      theme: { color: '#2dd4bf' }
    };

    var rzp = new Razorpay(options);
    rzp.open();
  }
</script>

</body>
</html>
