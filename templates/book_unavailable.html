{% extends "base.html" %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
  body { background:#0b0c10 !important; color:#eef0f5 !important; }
  .bu-page {
    min-height: calc(100vh - 64px);
    background: #0b0c10;
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem; position: relative;
  }
  .bu-page::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 60% 50% at 30% 40%, rgba(248,113,113,.06) 0%,transparent 55%),
      radial-gradient(ellipse 50% 50% at 80% 70%, rgba(201,168,76,.04) 0%,transparent 55%);
  }
  .bu-wrap {
    position:relative; z-index:1;
    text-align:center; max-width:480px;
    animation:buIn .7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes buIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .bu-icon {
    width:72px; height:72px; border-radius:20px;
    background:rgba(248,113,113,.08);
    border:1px solid rgba(248,113,113,.18);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 1.5rem;
  }
  .bu-icon svg { width:32px; height:32px; color:#f87171; }

  .bu-badge {
    display:inline-flex; align-items:center; gap:.35rem;
    padding:.28rem .8rem;
    background:rgba(248,113,113,.08);
    border:1px solid rgba(248,113,113,.18);
    border-radius:999px;
    font-size:.7rem; font-weight:600; color:#f87171;
    letter-spacing:.08em; text-transform:uppercase;
    margin-bottom:.85rem;
  }
  .bu-badge-dot {
    width:5px; height:5px; border-radius:50%;
    background:#f87171; box-shadow:0 0 6px rgba(248,113,113,.7);
  }

  .bu-title { font-size:1.5rem; font-weight:800; color:#eef0f5; margin-bottom:.6rem; letter-spacing:-.02em; }
  .bu-sub   { font-size:.9rem; color:rgba(238,240,245,.45); line-height:1.7; margin-bottom:.5rem; }

  {% if book %}
  .bu-book-card {
    display:flex; align-items:center; gap:.85rem;
    padding:.9rem 1.1rem; margin:1.25rem 0;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px; text-align:left;
  }
  .bu-book-icon {
    width:36px; height:36px; border-radius:9px; flex-shrink:0;
    background:rgba(248,113,113,.1);
    display:flex; align-items:center; justify-content:center;
  }
  .bu-book-icon svg { width:16px; height:16px; color:#f87171; }
  .bu-book-label { font-size:.65rem; color:rgba(238,240,245,.35); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.18rem; }
  .bu-book-name  { font-size:.88rem; font-weight:600; color:#eef0f5; }
  {% endif %}

  .bu-actions { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem; }
  .bu-btn {
    display:inline-flex; align-items:center; gap:.45rem;
    padding:.65rem 1.3rem; border-radius:10px;
    font-size:.84rem; font-weight:600;
    text-decoration:none; transition:all .2s;
    font-family:'DM Sans',system-ui,sans-serif;
  }
  .bu-btn-primary {
    background:linear-gradient(135deg,#9a6a22,#c9a84c);
    color:#0b0c10; box-shadow:0 3px 14px rgba(201,168,76,.25);
  }
  .bu-btn-primary:hover { box-shadow:0 5px 20px rgba(201,168,76,.4); transform:translateY(-1px); }
  .bu-btn-ghost {
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:rgba(238,240,245,.55);
  }
  .bu-btn-ghost:hover { background:rgba(255,255,255,.08); color:#eef0f5; }
  .bu-btn svg { width:14px; height:14px; }
</style>

<div class="bu-page">
  <div class="bu-wrap">

    <div class="bu-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <div class="bu-badge">
      <div class="bu-badge-dot" aria-hidden="true"></div>
      Not Available
    </div>

    <h1 class="bu-title">Book Currently Unavailable</h1>
    <p class="bu-sub">
      This book has already been rented by another student.<br>
      It will become available once returned.
    </p>

    {% if book %}
    <div class="bu-book-card">
      <div class="bu-book-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <div class="bu-book-label">Requested Book</div>
        <div class="bu-book-name">{{ book.book_title }}</div>
      </div>
    </div>
    {% endif %}

    <div class="bu-actions">
      <a href="{% url 'all_books' %}" class="bu-btn bu-btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(11,12,16,.85)"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Browse Other Books
      </a>
      <a href="javascript:history.back()" class="bu-btn bu-btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go Back
      </a>
    </div>

  </div>
</div>

{% endblock content %}
